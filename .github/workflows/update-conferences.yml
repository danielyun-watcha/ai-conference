name: Update Conferences

permissions:
  contents: write
  pull-requests: write

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9:00 UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-conferences:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml requests

    - name: Update conferences from ccfddl
      run: python .github/scripts/update_conferences.py

    - name: Check for changes
      id: git-check
      run: |
        git diff --exit-code || echo "changes=true" >> $GITHUB_OUTPUT

    - name: Create Pull Request
      if: steps.git-check.outputs.changes == 'true'
      uses: peter-evans/create-pull-request@v5
      with:
        commit-message: 'chore: update conference deadlines from ccfddl'
        title: 'Update conference deadlines from ccfddl'
        body: |
          Weekly auto-update of conference deadlines from [ccfddl](https://github.com/ccfddl/ccf-deadlines).

          Fetches from categories: AI, CG, DB, HI, MX and updates existing YAML files.
          Manually added fields (tags, venue, era_rating, note, etc.) are preserved.

          Auto-generated by GitHub Actions.
        branch: update-conferences
        delete-branch: true
        base: main
